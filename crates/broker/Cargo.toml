[package]
name = "ime-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Build into a separate acceptance binary, never into the beta distribution.
fault-injection = []

[dependencies]
ime-protocol = { path = "../protocol" }
ime-rime-adapter = { path = "../rime-adapter" }
ime-broker-transport = { path = "../broker-transport" }
serde = "=1.0.228"

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.48.0", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
