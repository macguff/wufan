# Controlled startup schema. Learning must remain disabled until ACK-driven
# learning is available; librime's ordinary commit learns before host ACK.
schema:
  schema_id: wufan_pinyin
  name: Wufan Pinyin
  version: '0.1.0'
switches:
  - name: ascii_mode
    reset: 0
    states: [Chinese, ASCII]
  - name: full_shape
    reset: 0
    states: [Half, Full]
  - name: simplification
    reset: 1
    states: [Traditional, Simplified]
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: luna_pinyin
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
simplifier:
  opencc_config: t2s.json
  option_name: simplification
  tips: none
menu:
  page_size: 9
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
key_binder:
  bindings:
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
    ':': { commit: '：' }
    ';': { commit: '；' }
    '(': '（'
    ')': '）'
  full_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
